aid: 3rdflix
name: Practically
description: >-
  Practically is the experiential-learning brand of 3rdFlix Visual Effects Private Limited, a
  Hyderabad, India edtech company founded in 2018 by Subbarao Siddabattula, Charu Noheria and
  Ilangovel Thulasimani. The original Practically app delivered 3D, AR and simulation-based STEM
  learning for classes 6-12 and raised roughly USD 14M. The company's live product is now Wriety,
  an interactive-whiteboard and classroom-collaboration platform for interactive flat panels (IFPs)
  that is marketed alongside a set of "Agentic APIs" - a catalogue of 100+ AI features (handwriting
  and math recognition, transcription, lesson and assessment generation, image analysis) offered to
  OEM panel makers. As of this pass no machine-readable API contract, developer portal or API
  reference is published anywhere on the estate; the only API collateral is a marketing PDF spec
  sheet, and access runs through a sales contact.
