  name: Wriety Agentic APIs
  description: >-
    Wriety's "Agentic APIs" are marketed as 100+ AI capabilities that OEM manufacturers embed into
    interactive flat panel displays - freehand and math recognition in 194 languages, doodle/object
    interpretation, transcription, meeting minutes, lesson and rubric generation, grading, data
    insights and image creation. The offering is published as a feature spec sheet and a brochure
    (both PDF) on wriety.com. No base URL, endpoint list, authentication model, SDK or
    machine-readable contract is published; the stated access path is a sales conversation with
    info@wriety.com.
  humanURL: https://www.wriety.com/aiapi
  image: https://www.wriety.com/favicon.svg
  x-baseurl-status: >-
    Not published. No base URL, host or endpoint appears on the AI API page, in the Agentic APIs
    spec sheet, in the brochure, or at any probed discovery path. api.wriety.com is the Wriety
    application backend (Apache, GET / 302s to an internal /admin/ SPA) and is not documented as
    a public API host, so it is deliberately NOT recorded as the baseURL. Left missing rather
    than guessed from the domain.
